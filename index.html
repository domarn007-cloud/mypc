<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CloudStream WebRTC Client</title>
  <style>
    :root {
      --bg: #07090e;
      --panel: rgba(18, 23, 35, 0.92);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      cursor: none;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: none;
    }

    video#remote-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }

    /* Zero-latency local cursor overlay */
    #local-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      border: 2px solid rgba(59, 130, 246, 0.95);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 9999;
      transform: translate3d(-100px, -100px, 0);
      transition: width 0.08s, height 0.08s, background 0.08s;
    }

    #local-cursor::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      margin-left: -2px;
      margin-top: -2px;
      background: #ffffff;
      border-radius: 50%;
    }

    #local-cursor.clicking {
      width: 12px;
      height: 12px;
      margin-left: -6px;
      margin-top: -6px;
      background: rgba(16, 185, 129, 0.8);
    }

    #local-cursor.hidden {
      display: none;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 20;
      display: flex;
      gap: 9px;
      align-items: center;
      padding: 6px 11px;
      background: rgba(10, 14, 23, 0.8);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      backdrop-filter: blur(6px);
      pointer-events: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #hud.ui-hidden {
      transform: translateY(-150%);
      opacity: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .dot.connected { background: var(--success); }
    .dot.connecting { background: var(--warn); }

    .divider { color: rgba(255, 255, 255, 0.2); }

    #toolbar {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: default;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #toolbar.ui-hidden {
      transform: translateY(-150%);
      opacity: 0;
      pointer-events: none;
    }

    /* Tiny unobtrusive corner tab to restore UI when hidden */
    #btn-restore-ui {
      position: fixed;
      top: 0;
      right: 12px;
      z-index: 26;
      background: rgba(18, 23, 35, 0.75);
      color: var(--text);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 3px 8px;
      font-size: 10px;
      cursor: pointer;
      opacity: 0.18;
      transition: opacity 0.15s ease;
      display: none;
    }

    #btn-restore-ui:hover {
      opacity: 1;
      background: var(--accent);
    }

    #btn-restore-ui.visible {
      display: block;
    }

    .btn-small {
      background: rgba(18, 23, 35, 0.88);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-small:hover {
      background: rgba(45, 58, 88, 0.95);
    }

    .btn-small.active-mode {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .sens-box {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(18, 23, 35, 0.88);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
    }

    .sens-box input[type="range"] {
      width: 60px;
      cursor: pointer;
    }

    #config-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 12, 0.82);
      backdrop-filter: blur(8px);
      cursor: default;
    }

    #config-modal.hidden { display: none; }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .card h1 { font-size: 18px; margin-bottom: 6px; }
    .card p { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.4; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
    .field input {
      width: 100%;
      padding: 9px 11px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      user-select: text;
      -webkit-user-select: text;
    }

    .row { display: flex; gap: 10px; }
    .row .field { flex: 1; }

    .btn-primary {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    #error-box {
      margin-top: 12px;
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div id="local-cursor"></div>

  <!-- Tiny translucent restore tab shown only when UI is hidden -->
  <button id="btn-restore-ui" type="button" title="Restore Overlay (Ctrl+Shift+H or F9)">Show UI</button>

  <div id="hud">
    <div class="badge">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">DISCONNECTED</span>
    </div>
    <span class="divider">|</span>
    <span>Res: <strong id="stat-res">0x0</strong></span>
    <span class="divider">|</span>
    <span>FPS: <strong id="stat-fps">0</strong></span>
    <span class="divider">|</span>
    <span>RTT: <strong id="stat-rtt">--</strong> ms</span>
    <span class="divider">|</span>
    <span>Mouse: <strong id="stat-input">Desktop 1:1</strong></span>
    <span class="divider">|</span>
    <span>Key: <strong id="stat-key">--</strong></span>
  </div>

  <div id="toolbar">
    <div class="sens-box" title="3D FPS Mouse Sensitivity">
      <span>Sens: <strong id="sens-val">1.2</strong>x</span>
      <input id="sens-slider" type="range" min="0.2" max="4.0" step="0.1" value="1.2" />
    </div>
    <button class="btn-small" id="btn-fps-lock" type="button">Lock Mouse: 3D FPS (F8)</button>
    <button class="btn-small" id="btn-send-esc" type="button">Send Esc</button>
    <button class="btn-small" id="btn-fullscreen" type="button">Fullscreen</button>
    <button class="btn-small" id="btn-settings" type="button">Setup</button>
    <button class="btn-small" id="btn-hide-ui" type="button" title="Shortcut: Ctrl+Shift+H or F9">Hide UI</button>
  </div>

  <div id="viewport">
    <video id="remote-video" autoplay playsinline muted></video>
  </div>

  <div id="config-modal">
    <div class="card">
      <h1>WebRTC Low-Latency Steam Host</h1>
      <p>Press <strong>Ctrl + Shift + H</strong> (or <strong>F9</strong>) anytime to hide/show the top overlay bars, or <strong>F8</strong> for 3D FPS mouse lock.</p>

      <div class="field">
        <label for="sig-url">Host Signaling URL (Cloudflare Tunnel)</label>
        <input id="sig-url" type="url" placeholder="https://random-words.trycloudflare.com" autocomplete="off" />
      </div>

      <div class="field">
        <label for="turn-url">TURN Server URLs (Comma-separated)</label>
        <input id="turn-url" type="text" autocomplete="off" />
      </div>

      <div class="row">
        <div class="field">
          <label for="turn-user">TURN Username</label>
          <input id="turn-user" type="text" autocomplete="off" />
        </div>
        <div class="field">
          <label for="turn-pass">TURN Credential</label>
          <input id="turn-pass" type="password" autocomplete="off" />
        </div>
      </div>

      <button id="btn-connect" class="btn-primary" type="button">Connect to Windows Host</button>
      <div id="error-box"></div>
    </div>
  </div>

  <script>
    (() => {
      const videoEl = document.getElementById("remote-video");
      const viewportEl = document.getElementById("viewport");
      const localCursor = document.getElementById("local-cursor");
      const hudEl = document.getElementById("hud");
      const toolbarEl = document.getElementById("toolbar");
      const restoreUiBtn = document.getElementById("btn-restore-ui");
      const hideUiBtn = document.getElementById("btn-hide-ui");
      const modalEl = document.getElementById("config-modal");
      const sigUrlInput = document.getElementById("sig-url");
      const turnUrlInput = document.getElementById("turn-url");
      const turnUserInput = document.getElementById("turn-user");
      const turnPassInput = document.getElementById("turn-pass");
      const connectBtn = document.getElementById("btn-connect");
      const settingsBtn = document.getElementById("btn-settings");
      const fullscreenBtn = document.getElementById("btn-fullscreen");
      const fpsLockBtn = document.getElementById("btn-fps-lock");
      const sendEscBtn = document.getElementById("btn-send-esc");
      const sensSlider = document.getElementById("sens-slider");
      const sensVal = document.getElementById("sens-val");
      const errorBox = document.getElementById("error-box");

      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const statRes = document.getElementById("stat-res");
      const statFps = document.getElementById("stat-fps");
      const statRtt = document.getElementById("stat-rtt");
      const statInput = document.getElementById("stat-input");
      const statKey = document.getElementById("stat-key");

      let pc = null;
      let videoReceiver = null;
      let fastChannel = null;
      let reliableChannel = null;
      let isPointerLocked = false;
      let isUiHidden = false;
      let mouseSensitivity = 1.2;
      let statsInterval = null;
      let pingInterval = null;

      sigUrlInput.value = localStorage.getItem("webrtc_sig_url") || "";
      turnUrlInput.value = localStorage.getItem("webrtc_turn_url") || "turn:standard.relay.metered.ca:80,turn:standard.relay.metered.ca:443,turns:standard.relay.metered.ca:443?transport=tcp";
      turnUserInput.value = localStorage.getItem("webrtc_turn_user") || "1d75a67fd754af20a9e6c3c6";
      turnPassInput.value = localStorage.getItem("webrtc_turn_pass") || "1MB0IFfLRlu6q0KO";

      function toggleUiVisibility() {
        isUiHidden = !isUiHidden;
        hudEl.classList.toggle("ui-hidden", isUiHidden);
        toolbarEl.classList.toggle("ui-hidden", isUiHidden);
        restoreUiBtn.classList.toggle("visible", isUiHidden);
      }

      hideUiBtn.addEventListener("click", toggleUiVisibility);
      restoreUiBtn.addEventListener("click", toggleUiVisibility);

      sensSlider.addEventListener("input", () => {
        mouseSensitivity = parseFloat(sensSlider.value) || 1.0;
        sensVal.textContent = mouseSensitivity.toFixed(1);
      });

      function isStreamingActive() {
        return modalEl.classList.contains("hidden");
      }

      function setStatus(state, label) {
        statusDot.className = "dot " + state;
        statusText.textContent = label;
      }

      function sendFast(payload) {
        if (fastChannel && fastChannel.readyState === "open") {
          fastChannel.send(JSON.stringify(payload));
        }
      }

      function sendReliable(payload) {
        if (reliableChannel && reliableChannel.readyState === "open") {
          reliableChannel.send(JSON.stringify(payload));
        }
      }

      function buildIceServers() {
        const servers = [
          { urls: ["stun:stun.l.google.com:19302", "stun:stun.cloudflare.com:3478"] }
        ];
        const turnUrl = turnUrlInput.value.trim();
        const turnUser = turnUserInput.value.trim();
        const turnPass = turnPassInput.value.trim();

        if (turnUrl) {
          const urls = turnUrl.split(",").map(s => s.trim()).filter(Boolean);
          const entry = { urls };
          if (turnUser) entry.username = turnUser;
          if (turnPass) entry.credential = turnPass;
          servers.push(entry);
        }
        return servers;
      }

      async function startConnection() {
        const rawUrl = sigUrlInput.value.trim().replace(/\/+\$/, "");
        if (!rawUrl.startsWith("https://") && !rawUrl.startsWith("http://localhost")) {
          errorBox.textContent = "Signaling URL must start with https://";
          return;
        }

        localStorage.setItem("webrtc_sig_url", rawUrl);
        localStorage.setItem("webrtc_turn_url", turnUrlInput.value.trim());
        localStorage.setItem("webrtc_turn_user", turnUserInput.value.trim());
        localStorage.setItem("webrtc_turn_pass", turnPassInput.value.trim());

        errorBox.textContent = "";
        connectBtn.disabled = true;
        connectBtn.textContent = "Negotiating ICE & Signaling...";
        setStatus("connecting", "CONNECTING");

        if (statsInterval) clearInterval(statsInterval);
        if (pingInterval) clearInterval(pingInterval);
        if (pc) {
          try { pc.close(); } catch (_) {}
          pc = null;
        }

        try {
          const iceServers = buildIceServers();
          pc = new RTCPeerConnection({
            iceServers,
            bundlePolicy: "max-bundle",
            iceCandidatePoolSize: 4
          });

          fastChannel = pc.createDataChannel("inputs_fast", { ordered: false, maxRetransmits: 0 });
          reliableChannel = pc.createDataChannel("inputs_reliable", { ordered: true });

          reliableChannel.onmessage = (evt) => {
            try {
              const msg = JSON.parse(evt.data);
              if (msg.t === "pong" && typeof msg.ts === "number") {
                statRtt.textContent = String(Math.round(performance.now() - msg.ts));
              }
            } catch (_) {}
          };

          pc.addTransceiver("video", { direction: "recvonly" });

          pc.ontrack = (event) => {
            if (event.track.kind === "video") {
              videoReceiver = event.receiver;
              if (videoReceiver && "playoutDelayHint" in videoReceiver) {
                videoReceiver.playoutDelayHint = 0;
              }
              if (videoReceiver && "jitterBufferTarget" in videoReceiver) {
                videoReceiver.jitterBufferTarget = 0;
              }
              const stream = (event.streams && event.streams[0])
                ? event.streams[0]
                : new MediaStream([event.track]);
              videoEl.srcObject = stream;
              videoEl.muted = true;
              videoEl.play().catch(() => {});
            }
          };

          pc.onconnectionstatechange = () => {
            const st = pc.connectionState;
            if (st === "connected") {
              setStatus("connected", "STREAMING");
              modalEl.classList.add("hidden");
              connectBtn.disabled = false;
              connectBtn.textContent = "Connect to Windows Host";
              videoEl.play().catch(() => {});
            } else if (st === "failed" || st === "disconnected" || st === "closed") {
              setStatus("", st.toUpperCase());
              connectBtn.disabled = false;
              connectBtn.textContent = "Reconnect to Windows Host";
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          await new Promise((resolve) => {
            if (pc.iceGatheringState === "complete") return resolve();
            const timeout = setTimeout(resolve, 4000);
            pc.onicegatheringstatechange = () => {
              if (pc.iceGatheringState === "complete") {
                clearTimeout(timeout);
                resolve();
              }
            };
          });

          const response = await fetch(rawUrl + "/offer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sdp: pc.localDescription.sdp,
              type: pc.localDescription.type,
              iceServers
            })
          });

          if (!response.ok) throw new Error("Host returned HTTP " + response.status);
          const answer = await response.json();
          await pc.setRemoteDescription(new RTCSessionDescription(answer));

          pingInterval = setInterval(() => {
            sendReliable({ t: "ping", ts: performance.now() });
            if (videoReceiver && "playoutDelayHint" in videoReceiver) {
              videoReceiver.playoutDelayHint = 0;
            }
          }, 1000);

          statsInterval = setInterval(async () => {
            if (!pc) return;
            const reports = await pc.getStats();
            reports.forEach((report) => {
              if (report.type === "inbound-rtp" && report.kind === "video") {
                if (typeof report.framesPerSecond === "number") {
                  statFps.textContent = String(Math.round(report.framesPerSecond));
                }
                if (report.frameWidth && report.frameHeight) {
                  statRes.textContent = `${report.frameWidth}x${report.frameHeight}`;
                }
              }
            });
          }, 1000);
        } catch (err) {
          setStatus("", "ERROR");
          errorBox.textContent = "Connection failed: " + (err.message || String(err));
          connectBtn.disabled = false;
          connectBtn.textContent = "Connect to Windows Host";
        }
      }

      function getNormalizedVideoCoords(clientX, clientY) {
        const rect = videoEl.getBoundingClientRect();
        const vw = videoEl.videoWidth || 1280;
        const vh = videoEl.videoHeight || 720;

        const videoAspect = vw / vh;
        const boxAspect = rect.width / rect.height;

        let renderW = rect.width;
        let renderH = rect.height;
        let offsetX = 0;
        let offsetY = 0;

        if (boxAspect > videoAspect) {
          renderW = rect.height * videoAspect;
          offsetX = (rect.width - renderW) / 2;
        } else {
          renderH = rect.width / videoAspect;
          offsetY = (rect.height - renderH) / 2;
        }

        const normX = (clientX - rect.left - offsetX) / renderW;
        const normY = (clientY - rect.top - offsetY) / renderH;

        return {
          x: Math.max(0, Math.min(1, Number(normX.toFixed(4)))),
          y: Math.max(0, Math.min(1, Number(normY.toFixed(4))))
        };
      }

      async function togglePointerLock() {
        if (document.pointerLockElement === viewportEl) {
          document.exitPointerLock();
        } else {
          try {
            await viewportEl.requestPointerLock({ unadjustedMovement: true });
          } catch (_) {
            try { viewportEl.requestPointerLock(); } catch (__) {}
          }
        }
      }

      document.addEventListener("pointerlockchange", () => {
        isPointerLocked = (document.pointerLockElement === viewportEl);
        if (isPointerLocked) {
          statInput.textContent = "3D FPS Locked";
          fpsLockBtn.textContent = "Unlock Mouse (Esc)";
          fpsLockBtn.classList.add("active-mode");
          localCursor.classList.add("hidden");
          sendReliable({ t: "cur", v: false });
        } else {
          statInput.textContent = "Desktop 1:1";
          fpsLockBtn.textContent = "Lock Mouse: 3D FPS (F8)";
          fpsLockBtn.classList.remove("active-mode");
          localCursor.classList.remove("hidden");
          sendReliable({ t: "cur", v: true });
          sendReliable({ t: "rel" });
        }
      });

      window.addEventListener("mousemove", (e) => {
        if (!isPointerLocked) {
          localCursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
        }

        if (!isStreamingActive()) return;

        if (isPointerLocked) {
          const dx = Math.round((e.movementX || 0) * mouseSensitivity);
          const dy = Math.round((e.movementY || 0) * mouseSensitivity);
          if (dx !== 0 || dy !== 0) {
            sendFast({ t: "mm", dx, dy });
          }
        } else {
          const pos = getNormalizedVideoCoords(e.clientX, e.clientY);
          sendFast({ t: "ma", x: pos.x, y: pos.y });
        }
      });

      viewportEl.addEventListener("mousedown", (e) => {
        localCursor.classList.add("clicking");
        if (!isStreamingActive()) return;
        e.preventDefault();
        if (!isPointerLocked) {
          const pos = getNormalizedVideoCoords(e.clientX, e.clientY);
          sendFast({ t: "ma", x: pos.x, y: pos.y });
        }
        sendReliable({ t: "md", b: e.button });
      });

      window.addEventListener("mouseup", (e) => {
        localCursor.classList.remove("clicking");
        if (!isStreamingActive()) return;
        sendReliable({ t: "mu", b: e.button });
      });

      viewportEl.addEventListener("wheel", (e) => {
        if (!isStreamingActive()) return;
        e.preventDefault();
        sendFast({ t: "mw", dy: e.deltaY });
      }, { passive: false });

      document.addEventListener("contextmenu", (e) => {
        if (isStreamingActive()) e.preventDefault();
      });

      window.addEventListener("keydown", (e) => {
        if (!isStreamingActive()) return;

        // Toggle UI Overlay visibility with Ctrl + Shift + H or F9
        if (e.code === "F9" || (e.ctrlKey && e.shiftKey && e.code === "KeyH")) {
          e.preventDefault();
          e.stopPropagation();
          toggleUiVisibility();
          return;
        }

        // Toggle 3D FPS Pointer Lock with F8
        if (e.code === "F8") {
          e.preventDefault();
          e.stopPropagation();
          togglePointerLock();
          return;
        }

        e.preventDefault();
        e.stopPropagation();

        statKey.textContent = e.code;
        if (!e.repeat) {
          sendReliable({ t: "kd", c: e.code });
        }
      }, { capture: true });

      window.addEventListener("keyup", (e) => {
        if (!isStreamingActive()) return;
        if (e.code === "F8" || e.code === "F9" || (e.ctrlKey && e.shiftKey && e.code === "KeyH")) {
          return;
        }

        e.preventDefault();
        e.stopPropagation();
        sendReliable({ t: "ku", c: e.code });
      }, { capture: true });

      window.addEventListener("blur", () => {
        sendReliable({ t: "rel" });
      });

      fpsLockBtn.addEventListener("click", togglePointerLock);

      sendEscBtn.addEventListener("click", () => {
        sendReliable({ t: "kd", c: "Escape" });
        setTimeout(() => sendReliable({ t: "ku", c: "Escape" }), 60);
      });

      fullscreenBtn.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            if (navigator.keyboard && navigator.keyboard.lock) {
              await navigator.keyboard.lock();
            }
          } else {
            await document.exitFullscreen();
          }
        } catch (_) {}
      });

      settingsBtn.addEventListener("click", () => {
        if (document.pointerLockElement) document.exitPointerLock();
        if (isUiHidden) toggleUiVisibility();
        modalEl.classList.toggle("hidden");
      });

      connectBtn.addEventListener("click", startConnection);
    })();
  </script>
</body>
</html>
