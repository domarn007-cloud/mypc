<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CloudStream WebRTC Client</title>
  <style>
    :root {
      --bg: #07090e;
      --panel: rgba(18, 23, 35, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    video#remote-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      cursor: crosshair;
    }

    /* HUD Telemetry Overlay */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 6px 12px;
      background: rgba(10, 14, 23, 0.78);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
    }

    .dot.connected { background: var(--success); }
    .dot.connecting { background: var(--warn); }

    .divider {
      color: rgba(255, 255, 255, 0.2);
    }

    /* Top-right Control Buttons */
    #toolbar {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 25;
      display: flex;
      gap: 8px;
    }

    .btn-small {
      background: rgba(18, 23, 35, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-small:hover {
      background: rgba(40, 50, 75, 0.95);
    }

    /* Connection Modal */
    #config-modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 12, 0.82);
      backdrop-filter: blur(8px);
    }

    #config-modal.hidden {
      display: none;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .card h1 {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 9px 11px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      user-select: text;
      -webkit-user-select: text;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .row .field {
      flex: 1;
    }

    .btn-primary {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #error-box {
      margin-top: 12px;
      font-size: 12px;
      color: var(--danger);
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div id="hud">
    <div class="badge">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">DISCONNECTED</span>
    </div>
    <span class="divider">|</span>
    <span>Res: <strong id="stat-res">0x0</strong></span>
    <span class="divider">|</span>
    <span>FPS: <strong id="stat-fps">0</strong></span>
    <span class="divider">|</span>
    <span>RTT: <strong id="stat-rtt">--</strong> ms</span>
    <span class="divider">|</span>
    <span>Bitrate: <strong id="stat-bitrate">0.0</strong> Mbps</span>
    <span class="divider">|</span>
    <span>Input: <strong id="stat-input">Unlocked</strong></span>
    <span class="divider">|</span>
    <span>Gamepad: <strong id="stat-gamepad">None</strong></span>
  </div>

  <div id="toolbar">
    <button class="btn-small" id="btn-fullscreen" type="button">Fullscreen &amp; Lock Keys</button>
    <button class="btn-small" id="btn-settings" type="button">Connection Setup</button>
  </div>

  <div id="viewport">
    <video id="remote-video" autoplay playsinline muted></video>
  </div>

  <div id="config-modal">
    <div class="card">
      <h1>WebRTC Low-Latency Steam Host</h1>
      <p>Enter your Cloudflare Tunnel HTTPS endpoint and TURN relay credentials.</p>

      <div class="field">
        <label for="sig-url">Host Signaling URL (Cloudflare Tunnel)</label>
        <input id="sig-url" type="url" placeholder="https://random-words.trycloudflare.com" autocomplete="off" />
      </div>

      <div class="field">
        <label for="turn-url">TURN Server URLs (Comma-separated)</label>
        <input id="turn-url" type="text" placeholder="turns:standard.relay.metered.ca:443?transport=tcp" autocomplete="off" />
      </div>

      <div class="row">
        <div class="field">
          <label for="turn-user">TURN Username</label>
          <input id="turn-user" type="text" placeholder="username" autocomplete="off" />
        </div>
        <div class="field">
          <label for="turn-pass">TURN Credential</label>
          <input id="turn-pass" type="password" placeholder="password" autocomplete="off" />
        </div>
      </div>

      <button id="btn-connect" class="btn-primary" type="button">Connect to Windows Host</button>
      <div id="error-box"></div>
    </div>
  </div>
